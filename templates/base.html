<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Signals{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700&family=Playfair+Display:ital,wght@0,600;0,700;1,500&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
              serif: ['"Playfair Display"', "Georgia", "serif"],
            },
            colors: {
              sig: {
                bg:      "#05100f",
                panel:   "#0c1f1e",
                teal:    "#0f3d3e",
                teallt:  "#1a5456",
                amber:   "#cc7a3f",
                amberlt: "#e8954f",
              },
            },
          },
        },
      };
    </script>
    <!-- Inline component styles — no dependency on static file serving -->
    <style>
      /* ── Ambient glow orbs ─────────────────────────────────────────────── */
      .sig-orb-a,
      .sig-orb-b {
        position: fixed;
        width: 42rem;
        height: 42rem;
        border-radius: 9999px;
        pointer-events: none;
        filter: blur(80px);
        z-index: 0;
      }
      .sig-orb-a {
        top: -14rem; right: -14rem;
        background: radial-gradient(circle, rgba(204,122,63,.18) 0%, transparent 70%);
      }
      .sig-orb-b {
        bottom: -14rem; left: -14rem;
        background: radial-gradient(circle, rgba(15,61,62,.30) 0%, transparent 70%);
      }

      /* ── Glass panel ───────────────────────────────────────────────────── */
      .sig-panel {
        background: linear-gradient(145deg, rgba(15,61,62,.22) 0%, rgba(5,16,15,.50) 100%);
        border: 1px solid rgba(255,255,255,.07);
        border-radius: 1.5rem;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        box-shadow: 0 24px 64px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06);
      }

      /* ── Stat / stage card ─────────────────────────────────────────────── */
      .sig-stat-card,
      .sig-stage-card {
        padding: 1rem 1.1rem;
        background: rgba(255,255,255,.035);
        border: 1px solid rgba(255,255,255,.07);
        border-radius: 1rem;
      }

      /* ── CTA button ────────────────────────────────────────────────────── */
      .sig-btn-cta {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: .85rem 1.75rem;
        border-radius: 9999px;
        border: none;
        background: linear-gradient(135deg, #cc7a3f 0%, #e8954f 100%);
        color: #fff !important;
        font-family: inherit;
        font-size: .9rem;
        font-weight: 700;
        letter-spacing: .01em;
        cursor: pointer;
        text-decoration: none;
        transition: opacity 150ms ease, transform 150ms ease, box-shadow 150ms ease;
        box-shadow: 0 10px 28px rgba(204,122,63,.35);
      }
      .sig-btn-cta:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: 0 14px 36px rgba(204,122,63,.40);
        opacity: .92;
      }
      .sig-btn-cta:disabled { opacity: .6; cursor: progress; }

      /* ── Outline button ────────────────────────────────────────────────── */
      .sig-btn-outline {
        display: inline-flex;
        align-items: center;
        padding: .75rem 1.5rem;
        border-radius: 1rem;
        border: 1px solid rgba(15,61,62,.6);
        background: rgba(15,61,62,.15);
        color: #94d5d6;
        font-family: inherit;
        font-size: .875rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 150ms ease, border-color 150ms ease, color 150ms ease;
      }
      .sig-btn-outline:hover {
        background: rgba(15,61,62,.35);
        border-color: rgba(26,84,86,.8);
        color: #c4e9ea;
      }

      /* ── Input ─────────────────────────────────────────────────────────── */
      .sig-input {
        display: block;
        padding: .85rem 1.1rem;
        background: rgba(255,255,255,.05) !important;
        border: 1px solid rgba(255,255,255,.10) !important;
        border-radius: .875rem;
        color: #f1f5f9 !important;
        font-family: inherit;
        font-size: .95rem;
        line-height: 1.6;
        transition: border-color 150ms ease, box-shadow 150ms ease, background 150ms ease;
        outline: none;
      }
      .sig-input::placeholder { color: rgba(148,163,184,.5); }
      .sig-input:focus {
        border-color: rgba(26,84,86,.7) !important;
        box-shadow: 0 0 0 3px rgba(15,61,62,.25);
        background: rgba(255,255,255,.07) !important;
      }

      /* ── Status badges ─────────────────────────────────────────────────── */
      .sig-badge {
        display: inline-block;
        padding: .2rem .65rem;
        border-radius: 9999px;
        font-size: .7rem;
        font-weight: 700;
        letter-spacing: .08em;
        text-transform: uppercase;
      }
      .sig-badge-muted  { background: rgba(100,116,139,.2);  color: #94a3b8; border: 1px solid rgba(100,116,139,.25); }
      .sig-badge-active { background: rgba(15,61,62,.45);    color: #5eead4; border: 1px solid rgba(26,84,86,.5); animation: sig-pulse 2s ease-in-out infinite; }
      .sig-badge-ok     { background: rgba(21,128,61,.25);   color: #86efac; border: 1px solid rgba(21,128,61,.35); }
      .sig-badge-fail   { background: rgba(185,28,28,.25);   color: #fca5a5; border: 1px solid rgba(185,28,28,.35); }
      @keyframes sig-pulse {
        0%,100% { border-color: rgba(26,84,86,.5); }
        50%      { border-color: rgba(94,234,212,.45); }
      }

      /* ── Audio progress ────────────────────────────────────────────────── */
      [data-audio-progress] {
        width: 0;
        height: 100%;
        border-radius: 9999px;
        background: linear-gradient(90deg, #0f3d3e 0%, #cc7a3f 100%);
        transition: width 120ms linear;
      }

      /* ── Thin scrollbar ────────────────────────────────────────────────── */
      ::-webkit-scrollbar            { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track      { background: transparent; }
      ::-webkit-scrollbar-thumb      { background: rgba(255,255,255,.10); border-radius: 9999px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.18); }
    </style>
  </head>
  <body class="bg-sig-bg text-slate-100 font-sans antialiased min-h-screen overflow-x-hidden selection:bg-sig-teal selection:text-white">
    <div class="sig-orb-a" aria-hidden="true"></div>
    <div class="sig-orb-b" aria-hidden="true"></div>
    {% block content %}{% endblock %}
  </body>
</html>
